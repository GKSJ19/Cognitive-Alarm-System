version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cognitive_alarm_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
      - /app/.pytest_cache
      - logs-volume:/app/logs
      - backups-volume:/app/backups
    environment:
      - DATABASE_URL=sqlite:///./cognitive_alarm.db
      - JWT_SECRET_KEY=9a3c9e6bbdfa414b22c71fb452fb1c49db82a895ee91f28a8b5333d80c836319d
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    restart: always

volumes:
  logs-volume:
  backups-volume:

