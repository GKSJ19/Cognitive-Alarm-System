[project]
name = "intelligent-cognitive-alarm-platform"
version = "4.0.0"
description = "AI-powered alarm platform with cognitive challenges, behavioral analytics, and comprehensive dashboards (Milestone 4)"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.3",
    "asyncpg>=0.30.0",
    "bcrypt==3.2.2",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "motor>=3.6.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    "pymongo>=4.9.0",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.30.6",
    # Milestone 3 — AI module dependencies
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "reportlab>=4.1.0",
    "openpyxl>=3.1.2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.6.9",
]
firebase = [
    "firebase-admin>=6.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "DTZ011", "BLE001", "UP045", "RUF022", "E501", "F821"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
