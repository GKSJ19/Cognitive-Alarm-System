version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: icap_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://icap_user:icap_password@db:5432/icap_db
      - SECRET_KEY=production_secret_key_change_me_icap_2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - ALLOWED_ORIGINS=["*"]
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:15-alpine
    container_name: icap_postgres
    environment:
      POSTGRES_USER: icap_user
      POSTGRES_PASSWORD: icap_password
      POSTGRES_DB: icap_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icap_user -d icap_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:
